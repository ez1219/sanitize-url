name: "Publish to npm"
run-name: Deploy ${{ github.repository }} to npmjs by @${{ github.actor }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type (major, minor, patch)"
        required: false
        type: choice
        default: "none"
        options:
          - none
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version & create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_type != 'none' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.version_type }} -m "chore(release): %s [skip ci]"
          git push
          git push --tags
          NEW_VERSION=$(node -p "require('./package.json').version")
          gh release create "v$NEW_VERSION" --title "v$NEW_VERSION" --generate-notes

      - name: Build package
        run: npm run build

      - name: Publish to npm (with Provenance / OIDC)
        run: |
          AUTH_TOKEN="${NPM_TOKEN:-$NODE_AUTH_TOKEN}"
          if [ -n "$AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$AUTH_TOKEN"
          fi
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
